<div class="service-page">
  
  <!-- HEADER -->
  <header class="service-hero viewport-section">
    <div class="underline-wrapper" appAnimate="reveal-left">
      <span class="section-label">03 / Servicing & garage</span>
      <svg class="underline-svg" viewBox="0 0 100 10">
        <line x1="0" y1="5" x2="100" y2="5" stroke="#ff0000" stroke-width="2" class="underline-line" />
      </svg>
    </div>
    <h1 class="huge-text" appAnimate="reveal-right">Workshop services</h1>
    <p class="service-intro-desc" appAnimate="reveal-up">
      Six high-capacity bays on Kindaruma Road. Equipped with advanced diagnostics and precision alignment rigs.
    </p>
  </header>

  <!-- SERVICES GRID -->
  <section class="services-grid-section">
    <div class="services-card-grid">
      @for (srv of services; track srv.index) {
        <div class="service-card" appAnimate="reveal-up">
          <div class="service-img-container">
            <img [src]="srv.img" class="service-card-img" [alt]="srv.title" loading="lazy">
            <span class="service-index">{{ srv.index }}</span>
          </div>
          <div class="service-card-body">
            <h3 class="service-card-title">{{ srv.title }}</h3>
            <p class="service-card-desc">{{ srv.desc }}</p>
            <div class="service-meta">
              <span class="meta-label">Est. turnaround:</span>
              <span class="meta-val">{{ srv.turnaround }}</span>
            </div>
            <a [routerLink]="['/contact']" [queryParams]="{service: srv.title}" class="book-service-btn">Book a service</a>
          </div>
        </div>
      }
    </div>
  </section>

</div>
